<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Finanzas | Mi Lash Book</title>
	<link rel="manifest" href="../manifest.json">
	<link rel="apple-touch-icon" href="../icon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="finanzas.css">
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="../storage.js"></script>
</head>
<body>
	<main class="finance-page">
		<header class="page-header">
			<a class="back-link" href="../inicio.html" aria-label="Volver al inicio">‹</a>
			<div>
				<p class="eyebrow">Mi Lash Book</p>
				<h1>Finanzas</h1>
			</div>
		</header>

		<section class="summary-grid" aria-label="Resumen financiero">
			<article class="summary-card summary-card--total">
				<p class="summary-label">Ingresos totales</p>
				<strong class="summary-value" id="total-income">$0</strong>
			</article>
			<article class="summary-card">
				<p class="summary-label">Citas registradas</p>
				<strong class="summary-value" id="total-appointments">0</strong>
			</article>
			<article class="summary-card">
				<p class="summary-label">Ticket promedio</p>
				<strong class="summary-value" id="average-income">$0</strong>
			</article>
		</section>

		<section class="history-section" aria-labelledby="history-title">
			<div class="section-heading">
				<div>
					<p class="eyebrow">Movimientos</p>
					<h2 id="history-title">Historial de ingresos</h2>
				</div>
				<span class="record-count" id="record-count">0</span>
			</div>
			<div class="records-list" id="records-list" aria-live="polite">
				<div class="empty-state" id="records-state">Todavía no tienes ingresos registrados.</div>
			</div>
		</section>
	</main>
	<script src="finanzas.js"></script>
	<script src="../pwa.js"></script>
</body>
</html>
