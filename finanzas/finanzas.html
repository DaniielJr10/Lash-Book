<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Finanzas | Mi Lash Book</title>
	<link rel="manifest" href="../manifest.json">
	<link rel="apple-touch-icon" href="../icon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="finanzas.css">
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="../storage.js"></script>
</head>
<body>
	<main class="finance-page">
		<header class="page-header">
			<a class="back-link" href="../inicio.html" aria-label="Volver al inicio">‹</a>
			<div>
				<p class="eyebrow">Mi Lash Book</p>
				<h1>Finanzas</h1>
			</div>
		</header>

		<section class="filter-toolbar" aria-label="Selector de periodo financiero">
			<div class="filter-buttons" role="tablist" aria-label="Ver ingresos por">
				<button type="button" class="filter-button is-active" data-range="month">Mes</button>
				<button type="button" class="filter-button" data-range="week">Semana</button>
				<button type="button" class="filter-button" data-range="day">Días</button>
			</div>
			<div class="filter-controls">
				<label class="range-control" data-control="month">
					<span>Mes</span>
					<input id="period-month" type="month">
				</label>
				<label class="range-control is-hidden" data-control="week">
					<span>Semana</span>
					<input id="period-week" type="date">
				</label>
				<div class="range-control range-control--range is-hidden" data-control="day">
					<label>
						<span>Desde</span>
						<input id="period-from" type="date">
					</label>
					<label>
						<span>Hasta</span>
						<input id="period-to" type="date">
					</label>
				</div>
			</div>
		</section>

		<section class="summary-grid" aria-label="Resumen financiero">
			<article class="summary-card summary-card--total">
				<p class="summary-label">Ingresos totales</p>
				<strong class="summary-value" id="total-income">$0</strong>
			</article>
		</section>

		<section class="history-section" aria-labelledby="history-title">
			<div class="section-heading">
				<div>
					<p class="eyebrow">Movimientos</p>
					<h2 id="history-title">Historial de ingresos</h2>
				</div>
				<span class="record-count" id="record-count">0</span>
			</div>
			<div class="records-list" id="records-list" aria-live="polite">
				<div class="empty-state" id="records-state">Todavía no tienes ingresos registrados.</div>
			</div>
		</section>
	</main>
	<div class="appointment-modal" id="appointment-modal" hidden>
		<div class="modal-backdrop" data-close-modal></div>
		<article class="appointment-detail" role="dialog" aria-modal="true" aria-labelledby="detail-title">
			<button class="modal-close" type="button" data-close-modal aria-label="Cerrar detalle">×</button>
			<p class="detail-kicker">Detalle de la cita</p>
			<h2 id="detail-title">Cita</h2>
			<div class="detail-date" id="detail-date"></div>
			<div class="detail-grid">
				<div class="detail-field--full"><span>Clienta</span><strong id="detail-client"></strong></div>
				<div><span>Servicio</span><strong id="detail-service"></strong></div>
				<div><span>Precio</span><strong id="detail-price"></strong></div>
			</div>
			<div class="detail-notes" id="detail-notes-wrap"><span>Notas</span><p id="detail-notes"></p></div>
			<div class="detail-actions">
				<button class="edit-button" id="edit-appointment" type="button">Editar cita</button>
				<button class="delete-button" id="delete-appointment" type="button">Borrar</button>
			</div>
		</article>
	</div>
	<div class="confirm-modal" id="delete-modal" hidden>
		<div class="modal-backdrop" data-close-delete></div>
		<article class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="delete-title">
			<div class="warning-icon" aria-hidden="true">!</div>
			<h2 id="delete-title">¿Borrar esta cita?</h2>
			<p id="delete-message">Esta acción no se puede deshacer.</p>
			<div class="confirm-actions">
				<button class="cancel-button" id="cancel-delete" type="button">Cancelar</button>
				<button class="confirm-delete-button" id="confirm-delete" type="button">Borrar cita</button>
			</div>
		</article>
	</div>
	<script src="finanzas.js"></script>
	<script src="../pwa.js"></script>
</body>
</html>
