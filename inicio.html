<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mi Lash Book</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="inicio.css">
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="storage.js"></script>
</head>
<body>
	<main class="dashboard" aria-label="Pantalla principal de Mi Lash Book">
		<section class="welcome-panel" aria-labelledby="page-title">
			<p class="date-label" id="current-date">Miércoles, 14 de octubre de 2026</p>
			<h1 id="page-title">Mi Lash Book</h1>
			<p class="welcome-message" id="welcome-message">No tienes citas para hoy.</p>
			<a class="primary-button" href="agendar_cita/agendar.html">
				<span class="button-plus" aria-hidden="true">+</span>
				Agregar cita
			</a>
		</section>

		<nav class="quick-links" aria-label="Accesos rápidos">
			<a class="quick-link" href="agendar_cita/agendar.html">
				<span class="quick-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24" role="img"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3v4M16 3v4M4 10h16M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"></path></svg>
				</span>
				<span>Agenda <b aria-hidden="true">›</b></span>
			</a>
			<a class="quick-link" href="misclientas/mis.html">
				<span class="quick-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24" role="img"><circle cx="12" cy="8" r="3"></circle><path d="M6 20c0-3.3 2.7-5 6-5s6 1.7 6 5M4 12a2.5 2.5 0 1 0 0 5M20 12a2.5 2.5 0 1 1 0 5"></path></svg>
				</span>
				<span>Clientas <b aria-hidden="true">›</b></span>
			</a>
			<button class="quick-link" type="button" id="technical-sheets">
				<span class="quick-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24" role="img"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg>
				</span>
				<span>Fichas técnicas <b aria-hidden="true">›</b></span>
			</button>
		</nav>

		<section class="content-section today-section" aria-labelledby="today-title">
			<div class="section-heading">
				<h2 id="today-title">Citas de hoy</h2>
				<a href="agendar_cita/agendar.html">Ver día</a>
			</div>
			<div class="empty-state" id="today-state">Tu agenda de hoy está libre.</div>
		</section>

		<section class="content-section upcoming-section" aria-labelledby="upcoming-title">
			<div class="section-heading">
				<h2 id="upcoming-title">Próximas citas</h2>
				<a href="agendar_cita/agendar.html">Ver agenda</a>
			</div>
			<div class="empty-state" id="upcoming-state">Aún no tienes citas próximas.</div>
		</section>
	</main>
	<div class="toast" id="toast" role="status" aria-live="polite"></div>
	<script src="inicio.js"></script>
</body>
</html>
